<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle mensal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f14; --elev: #12181f; --soft: #1a222c; --line: #2a3440;
            --text: #e8eef4; --muted: #8b9aab; --faint: #6b7a8a;
            --accent: #3dd6c6; --blue: #7db0ff; --orange: #f0a14a;
            --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; color-scheme: dark; }
        body { font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); }
        button, input, select { font-family: inherit; color-scheme: dark; }
        .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
        .sidebar { border-right: 1px solid var(--line); background: #0e141b; padding: 22px 14px; display: flex; flex-direction: column; }
        .brand { font-weight: 700; padding: 0 10px 22px; }
        .brand small { display: block; color: var(--faint); font-weight: 400; margin-top: 4px; }
        .nav button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); padding: 11px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; font-size: 14px; }
        .nav button.active { background: var(--soft); color: var(--text); }
        .status { margin-top: auto; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; padding: 10px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
        .dot.ok { background: var(--green); } .dot.err { background: var(--red); } .dot.load { background: var(--yellow); }
        .main { padding: 24px 28px 48px; max-width: 980px; }
        .top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: end; margin-bottom: 18px; }
        .top h2 { font-size: 26px; }
        .top p { color: var(--muted); margin-top: 6px; font-size: 14px; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
        .field span { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; }
        select, input[type="number"], .cell {
            background: var(--soft); color: var(--text); border: 1px solid var(--line);
            border-radius: 10px; padding: 10px 12px; width: 100%; outline: none;
        }
        input[type="number"], .cell { font-family: "IBM Plex Mono", monospace; text-align: right; }
        select:focus, input:focus { border-color: var(--accent); }
        .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        .kpi { background: var(--elev); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
        .kpi label { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
        .kpi strong { display: block; margin-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 500; }
        .pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--yellow); }
        .card { background: var(--elev); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
        .card.cat { border-left: 4px solid var(--cat, var(--accent)); }
        .card.cat .card-head { background: var(--cat-bg, #1a222c); }
        .card.cat .card-head h3, .card.cat .card-head .meta { color: var(--cat, var(--accent)); }
        .card.cat-pessoas { --cat: #c084fc; --cat-bg: rgba(192,132,252,.14); }
        .card.cat-cartoes { --cat: #f87171; --cat-bg: rgba(248,113,113,.14); }
        .card.cat-assinaturas { --cat: #f472b6; --cat-bg: rgba(244,114,182,.14); }
        .card.cat-variaveis { --cat: #fbbf24; --cat-bg: rgba(251,191,36,.14); }
        .card.cat-investimentos { --cat: #34d399; --cat-bg: rgba(52,211,153,.14); }
        .card.cat-outros { --cat: #38bdf8; --cat-bg: rgba(56,189,248,.14); }
        .card.cat-emp1 { --cat: #fb923c; --cat-bg: rgba(251,146,60,.14); }
        .card.cat-emp2 { --cat: #22d3ee; --cat-bg: rgba(34,211,238,.14); }
        .card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
        .card-head h3 { font-size: 14px; font-weight: 600; }
        .card-body { padding: 8px 18px 16px; }
        .row { display: grid; grid-template-columns: 1fr 160px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #1e2731; }
        .row:last-child { border-bottom: 0; }
        .row label { color: var(--text); font-size: 14px; }
        .row .meta { color: var(--faint); font-size: 11px; margin-top: 2px; }
        .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .btn { border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600; font-size: 13px; background: linear-gradient(135deg, #2dd4bf, #22a6c7); color: #042023; }
        .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
        .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px 18px; background: #10161c; }
        .totals div { color: var(--muted); font-size: 12px; }
        .totals strong { display: block; margin-top: 4px; font-family: "IBM Plex Mono", monospace; font-size: 16px; color: var(--text); }
        .hidden { display: none !important; }
        .banner { display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(248,113,113,.1); color: #fecaca; }
        .banner.show { display: block; }
        .evo { overflow: auto; max-height: 420px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
        th { color: var(--faint); font-size: 11px; text-transform: uppercase; }
        td.num { text-align: right; font-family: "IBM Plex Mono", monospace; }
        table input { width: 110px; padding: 7px 8px; }
        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .kpis, .cats, .totals { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">Controle mensal<small>Finanças pessoais</small></div>
            <nav class="nav">
                <button class="active" data-view="contabilidade" onclick="setView('contabilidade')">Contabilidade geral</button>
                <button data-view="emprestimos" onclick="setView('emprestimos')">Empréstimos</button>
            </nav>
            <div class="status"><span class="dot" id="dot"></span><span id="statusText">Carregando...</span></div>
        </aside>
        <main class="main">
            <div class="banner" id="banner"></div>
            <div class="top">
                <div>
                    <h2 id="pageTitle">Contabilidade geral</h2>
                    <p id="pageSub">Filtre o mês e a categoria. Edite os valores e salve.</p>
                </div>
                <div class="filters">
                    <label class="field"><span>Mês</span><select id="filtroMes" onchange="render()"></select></label>
                    <label class="field"><span>Categoria</span><select id="filtroCat" onchange="render()"></select></label>
                    <button class="btn" type="button" onclick="salvarAtual()">Salvar</button>
                </div>
            </div>
            <section class="kpis" id="kpis"></section>
            <div id="viewContabilidade"></div>
            <div id="viewEmprestimos" class="hidden"></div>
        </main>
    </div>
    <script>
        const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const CATEGORIAS = [
            { id: 'pessoas', label: 'Pessoas', cor: '#c084fc' },
            { id: 'cartoes', label: 'Cartões', cor: '#f87171' },
            { id: 'assinaturas', label: 'Assinaturas', cor: '#f472b6' },
            { id: 'variaveis', label: 'Variáveis', cor: '#fbbf24' },
            { id: 'investimentos', label: 'Investimentos', cor: '#34d399' },
            { id: 'outros', label: 'Outros', cor: '#38bdf8' }
        ];
        const CAMPOS = [
            { id: 'das', label: 'Das', categoria: 'outros', no_total: false },
            { id: 'maximo', label: 'Max', categoria: 'pessoas', no_total: false },
            { id: 'oliveira', label: 'Oliveira', categoria: 'pessoas', no_total: false },
            { id: 'gabriel', label: 'Gabriel', categoria: 'pessoas', no_total: false },
            { id: 'aluguel', label: 'Aluguel', categoria: 'outros', no_total: false },
            { id: 'variaveis', label: 'Variáveis', categoria: 'variaveis', no_total: false },
            { id: 'internet', label: 'Internet', categoria: 'assinaturas', no_total: false },
            { id: 'netflix', label: 'Netflix', categoria: 'assinaturas', no_total: true },
            { id: 'spotify', label: 'Spotify', categoria: 'assinaturas', no_total: true },
            { id: 'youtube', label: 'YouTube', categoria: 'assinaturas', no_total: true },
            { id: 'bradesco', label: 'Bradesco - Fatura', categoria: 'cartoes', no_total: false },
            { id: 'mercado_pago', label: 'Mercado Pago', categoria: 'cartoes', no_total: false },
            { id: 'nubank', label: 'Nubank - Fatura', categoria: 'cartoes', no_total: false },
            { id: 'emprestimo_nu', label: 'Empréstimo Nu', categoria: 'outros', no_total: false },
            { id: 'gasolina', label: 'Gasolina', categoria: 'variaveis', no_total: true },
            { id: 'investimento', label: 'Investimento', categoria: 'investimentos', no_total: true }
        ];
        let dados = { contabilidade: [], emprestimos: [] };
        let view = 'contabilidade';
        const money = n => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const mesFull = ym => { const [y,m] = (ym||'').split('-'); return `${MONTHS[Number(m)-1] || ''} de ${y}`; };
        const num = n => { const v = parseFloat(String(n).replace(',', '.')); return Number.isFinite(v) ? Math.round(v * 100) / 100 : 0; };
        const round2 = n => Math.round(Number(n || 0) * 100) / 100;
        const show = n => {
            if (n === null || n === undefined || n === '') return '';
            const v = Number(n);
            return Number.isFinite(v) ? String(v) : '';
        };
        const catOf = id => CATEGORIAS.find(c => c.id === id) || { label: id, cor: '#7dd3fc' };

        function setStatus(kind, text) {
            document.getElementById('dot').className = 'dot ' + kind;
            document.getElementById('statusText').textContent = text;
        }
        function showBanner(t) {
            const el = document.getElementById('banner');
            el.textContent = t || '';
            el.classList.toggle('show', Boolean(t));
        }
        async function api(path, options) {
            const res = await fetch(path, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.erro || 'Falha na operação');
            return data;
        }

        function mesAtual() {
            const sel = document.getElementById('filtroMes');
            return sel.value || ((dados.contabilidade[0] || {}).mes);
        }
        function linhaMes() {
            const mes = mesAtual();
            const row = (dados.contabilidade || []).find(r => r.mes === mes) || {};
            const out = { mes, salario: row.salario || 0, valor_pago: row.valor_pago || 0 };
            CAMPOS.forEach(c => { out[c.id] = row[c.id] != null ? row[c.id] : 0; });
            return out;
        }
        function idsTotal() { return CAMPOS.filter(c => !c.no_total).map(c => c.id); }

        function setView(next) {
            view = next;
            document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.view === next));
            document.getElementById('pageTitle').textContent = next === 'contabilidade' ? 'Contabilidade geral' : 'Empréstimos';
            document.getElementById('pageSub').textContent = next === 'contabilidade'
                ? 'Filtre o mês e a categoria. Edite os valores e salve.'
                : 'O valor inicial vai diminuindo a cada pagamento. Não é a soma dos meses.';
            document.getElementById('viewContabilidade').classList.toggle('hidden', next !== 'contabilidade');
            document.getElementById('viewEmprestimos').classList.toggle('hidden', next !== 'emprestimos');
            preencherFiltros();
            render();
        }

        function preencherFiltros() {
            const mesSel = document.getElementById('filtroMes');
            const catSel = document.getElementById('filtroCat');
            const meses = [...new Set([
                ...(dados.contabilidade || []).map(r => r.mes),
                ...(dados.emprestimos || []).map(r => r.mes)
            ])].sort();
            const hoje = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
            const mesKeep = mesSel.value || (meses.includes(hoje) ? hoje : (meses[0] || ''));
            mesSel.innerHTML = meses.map(m => `<option value="${m}">${mesFull(m)}</option>`).join('');
            if (meses.includes(mesKeep)) mesSel.value = mesKeep;
            const catKeep = catSel.value || 'todas';
            if (view === 'emprestimos') {
                catSel.innerHTML = '<option value="todas">Total dos empréstimos</option><option value="1">Empréstimo 1</option><option value="2">Empréstimo 2</option>';
            } else {
                catSel.innerHTML = '<option value="todas">Todas as categorias</option>' + CATEGORIAS.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
            }
            if ([...catSel.options].some(o => o.value === catKeep)) catSel.value = catKeep;
        }

        function render() {
            if (view === 'contabilidade') renderContab();
            else renderEmp();
        }

        function renderContab() {
            const row = linhaMes();
            const cat = document.getElementById('filtroCat').value;
            const grupos = CATEGORIAS.filter(g => cat === 'todas' || g.id === cat);
            document.getElementById('viewContabilidade').innerHTML = `
                <div class="card">
                    <div class="card-head"><h3>Receita e pagamento</h3></div>
                    <div class="card-body">
                        <div class="row"><div><label>Salário</label></div><input id="cSalario" type="number" step="0.01" value="${show(row.salario)}"></div>
                        <div class="row"><div><label>Valor já pago</label></div><input id="cPago" type="number" step="0.01" value="${show(row.valor_pago)}"></div>
                    </div>
                </div>
                <div class="cats" id="cats">${grupos.map(g => {
                    const campos = CAMPOS.filter(c => c.categoria === g.id);
                    const subtotal = round2(campos.reduce((a, c) => a + num(row[c.id]), 0));
                    return `<section class="card cat cat-${g.id}" data-cat="${g.id}">
                        <div class="card-head"><h3>${g.label}</h3><span class="meta">${money(subtotal)}</span></div>
                        <div class="card-body">${campos.map(c => `
                            <div class="row">
                                <div><label>${c.label}</label></div>
                                <input id="c_${c.id}" type="number" step="0.01" value="${show(row[c.id])}">
                            </div>`).join('')}
                        </div>
                    </section>`;
                }).join('')}</div>
                <div class="card"><div class="totals" id="totais"></div></div>`;
            document.querySelectorAll('#viewContabilidade input').forEach(i => i.addEventListener('input', atualizarTotais));
            atualizarTotais();
        }

        function somaTotal() {
            return round2(idsTotal().reduce((a, id) => a + num(document.getElementById('c_' + id)?.value), 0));
        }
        function atualizarTotais() {
            const salario = num(document.getElementById('cSalario')?.value);
            const pago = num(document.getElementById('cPago')?.value);
            const total = somaTotal();
            const falta = round2(total - pago);
            const sobra = round2(salario - total);
            document.getElementById('kpis').innerHTML = [
                ['Salário', money(salario), ''],
                ['Total a pagar', money(total), ''],
                [falta < 0 ? 'Pago a mais' : 'Ainda falta', money(Math.abs(falta)), falta > 0 ? 'warn' : 'pos'],
                ['Sobra', money(sobra), sobra >= 0 ? 'pos' : 'neg']
            ].map(([l,v,c]) => `<article class="kpi"><label>${l}</label><strong class="${c}">${v}</strong></article>`).join('');
            const box = document.getElementById('totais');
            if (box) box.innerHTML = `
                <div>Total a pagar<strong>${money(total)}</strong></div>
                <div>Faltante<strong class="${falta>0?'warn':''}">${money(falta)}</strong></div>
                <div>Sobra<strong class="${sobra>=0?'pos':'neg'}">${money(sobra)}</strong></div>`;
            CATEGORIAS.forEach(g => {
                const card = document.querySelector(`#cats .card[data-cat="${g.id}"]`);
                if (!card) return;
                const subtotal = round2(CAMPOS.filter(c => c.categoria === g.id)
                    .reduce((a, c) => a + num(document.getElementById('c_' + c.id)?.value), 0));
                const meta = card.querySelector('.card-head .meta');
                if (meta) meta.textContent = money(subtotal);
            });
        }

        function coletarMes() {
            const payload = { mes: mesAtual(), salario: num(document.getElementById('cSalario')?.value), valor_pago: num(document.getElementById('cPago')?.value) };
            const atual = linhaMes();
            CAMPOS.forEach(c => {
                const el = document.getElementById('c_' + c.id);
                payload[c.id] = el ? num(el.value) : num(atual[c.id]);
            });
            return payload;
        }

        function renderEmp() {
            const mes = mesAtual();
            const cat = document.getElementById('filtroCat').value;
            const nums = cat === 'todas' ? [1, 2] : [Number(cat)];
            const cards = nums.map(n => {
                const lista = (dados.emprestimos || [])
                    .filter(r => Number(r.emprestimo) === Number(n))
                    .sort((a,b) => a.mes.localeCompare(b.mes));
                const original = lista.length ? Number(lista[0].saldo_inicio) || 0 : 0;
                const atual = lista.find(r => r.mes === mes);
                const saldoMes = atual ? Number(atual.saldo_inicio) || 0 : (lista.length && mes < lista[0].mes ? original : 0);
                const pagMes = atual ? Number(atual.pagamento) || 0 : 0;
                const juros = round2(saldoMes * 0.02);
                const pagj = round2(pagMes + juros);
                const fim = round2(saldoMes - pagMes);
                return `<section class="card cat cat-emp${n}" data-emp="${n}" data-original="${original}">
                    <div class="card-head"><h3>Empréstimo ${n}</h3><span class="meta">Original ${money(original)}</span></div>
                    <div class="card-body">
                        <div class="row"><div><label>Saldo deste mês</label><div class="meta">Diminui a cada pagamento</div></div>
                            <input class="saldo" type="number" step="0.01" value="${show(saldoMes)}"></div>
                        <div class="row"><div><label>Juros 2%</label></div><div class="cell juros">${money(juros)}</div></div>
                        <div class="row"><div><label>Pagamento</label></div>
                            <input class="pag" type="number" step="0.01" value="${show(pagMes)}"></div>
                        <div class="row"><div><label>Pagamento + juros</label></div><div class="cell pagj">${money(pagj)}</div></div>
                        <div class="row"><div><label>Saldo no fim do mês</label><div class="meta">Saldo − pagamento</div></div><div class="cell fim">${money(fim)}</div></div>
                    </div>
                    <div class="evo">
                        <table>
                            <thead><tr><th>Mês</th><th class="num">Saldo</th><th class="num">Juros</th><th class="num">Pagamento</th><th class="num">Saldo fim</th></tr></thead>
                            <tbody>${lista.map(r => `<tr>
                                <td>${mesFull(r.mes)}</td>
                                <td class="num">${money(r.saldo_inicio)}</td>
                                <td class="num">${money(r.juros)}</td>
                                <td class="num">${money(r.pagamento)}</td>
                                <td class="num">${money(r.saldo_fim)}</td>
                            </tr>`).join('')}</tbody>
                        </table>
                    </div>
                    <input type="hidden" class="emp-id" value="${atual && atual.id ? atual.id : ''}">
                    <input type="hidden" class="emp-n" value="${n}">
                </section>`;
            }).join('');
            document.getElementById('viewEmprestimos').innerHTML = cards || '<p class="banner show">Nenhum empréstimo neste filtro.</p>';
            document.querySelectorAll('#viewEmprestimos .card').forEach(card => {
                card.querySelectorAll('input.saldo, input.pag').forEach(i => i.addEventListener('input', () => recalcEmpCard(card)));
                recalcEmpCard(card);
            });
            atualizarKpiEmp();
        }

        function recalcEmpCard(card) {
            const saldo = num(card.querySelector('.saldo').value);
            const pag = num(card.querySelector('.pag').value);
            const juros = round2(saldo * 0.02);
            card.querySelector('.juros').textContent = money(juros);
            card.querySelector('.pagj').textContent = money(round2(pag + juros));
            card.querySelector('.fim').textContent = money(round2(saldo - pag));
            atualizarKpiEmp();
        }
        function atualizarKpiEmp() {
            const cards = [...document.querySelectorAll('#viewEmprestimos .card[data-emp]')];
            const original = cards.reduce((a, c) => a + num(c.dataset.original), 0);
            const saldo = cards.reduce((a, c) => a + num(c.querySelector('.saldo')?.value), 0);
            const pag = cards.reduce((a, c) => a + num(c.querySelector('.pag')?.value), 0);
            const juros = cards.reduce((a, c) => a + round2(num(c.querySelector('.saldo')?.value) * 0.02), 0);
            const fim = round2(saldo - pag);
            document.getElementById('kpis').innerHTML = [
                ['Valor original', money(original), ''],
                ['Saldo deste mês', money(saldo), ''],
                ['Pagamento do mês', money(pag), ''],
                ['Juros 2%', money(juros), 'warn']
            ].map(([l,v,c]) => `<article class="kpi"><label>${l}</label><strong class="${c}">${v}</strong></article>`).join('');
        }

        async function salvarAtual() {
            setStatus('load', 'Salvando...');
            try {
                if (view === 'contabilidade') {
                    dados = await api('/api/contabilidade', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(coletarMes())
                    });
                } else {
                    const itens = [...document.querySelectorAll('#viewEmprestimos .card')].map(card => ({
                        id: card.querySelector('.emp-id').value ? Number(card.querySelector('.emp-id').value) : null,
                        mes: mesAtual(),
                        emprestimo: Number(card.querySelector('.emp-n').value),
                        saldo_inicio: num(card.querySelector('.saldo').value),
                        pagamento: num(card.querySelector('.pag').value)
                    }));
                    dados = await api('/api/emprestimos/lote', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ emprestimos: itens })
                    });
                }
                setStatus('ok', 'Alterações salvas');
                preencherFiltros();
                render();
            } catch (err) {
                setStatus('err', 'Falha ao salvar');
                alert(err.message);
            }
        }

        async function carregar() {
            if (location.protocol === 'file:') {
                showBanner('Abra pelo Iniciar.bat, em http://localhost:8765.');
                setStatus('err', 'Servidor não detectado');
                return;
            }
            try {
                dados = await api('/api/dados');
                setStatus('ok', 'Pronto para editar');
                preencherFiltros();
                render();
            } catch (err) {
                showBanner('Não foi possível carregar. Execute o Iniciar.bat. ' + err.message);
                setStatus('err', 'Falha ao carregar');
            }
        }
        carregar();
    </script>
</body>
</html>
